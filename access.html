<!DOCTYPE html>

    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">本文へ移動</a>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="FortGate ホーム">
          <img src="assets/img/logo.JPG" alt="FortGate" class="brand-logo" />
        </a>

        <button
          type="button"
          class="menu-toggle"
          aria-label="メニューを開く"
          aria-expanded="false"
          aria-controls="global-nav"
        >
          <span></span><span></span><span></span>
        </button>

        <nav id="global-nav" class="site-nav" aria-label="グローバルナビゲーション">
          <a href="index.html">トップ</a>

          <a href="services.html">事業内容</a>
          <a href="contact.html" class="nav-cta">お問い合わせ</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="page-hero section-shell">
        <div class="container narrow">
          <p class="eyebrow dark fade-up">Access</p>
          <h1 class="fade-up">アクセス</h1>
          <p class="fade-up">
            お打ち合わせはオンラインを中心に実施しています。<br />
            ご来訪が必要な場合は、事前にご連絡ください。
          </p>
        </div>
      </section>

      <section class="section-shell">
        <div class="container narrow access-box">
          <div class="access-copy">
            <h2 class="fade-up">所在地</h2>
            <p class="fade-up">〒000-0000<br />東京都〇〇区〇〇〇丁目○-○</p>
            <p class="fade-up">
              ※ バーチャルオフィス利用のため、来訪前に必ずお問い合わせください。
            </p>

            <h2 class="fade-up">最寄り駅</h2>
            <p class="fade-up">〇〇駅より徒歩5分 / 〇〇線〇〇駅より徒歩10分</p>
          </div>

          <div class="map-placeholder fade-up">Google Map を埋め込み予定です</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-meta-simple has-link">
        <small>© 2026 FortGate. All rights reserved.</small>
        <a href="privacy.html" class="footer-privacy-link">プライバシーポリシー</a>
